services:
  # ── Backend API (Render Web Service) ──────────────
  - type: web
    name: study-planner-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"

      # ── Aiven MySQL (set these in Render Dashboard) ──
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_CA_CERT
        sync: false   # paste your Aiven CA.pem content here

      - key: JWT_SECRET
        generateValue: true

      - key: FRONTEND_URL
        sync: false   # set to your Vercel URL: https://your-app.vercel.app

      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
